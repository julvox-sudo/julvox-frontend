<script id="product-realign-01b-home-runtime">
(function productRealign01BHomeRuntime(){
  'use strict';
  var STORAGE_KEY = "julvox:decision-home:conversations:v1";
  var MAX_CONVERSATIONS = 2;
  var root = document.getElementById('julvoxDecisionHome');
  if (!root) return;

  var SECONDARY_ROUTES = Object.freeze({
    help: Object.freeze({ hash: '#aide', pageId: 'pr01bHelpPage' }),
    settings: Object.freeze({ hash: '#parametres', pageId: 'pr01bSettingsPage' }),
    assistant: Object.freeze({ hash: '#assistant', pageId: null }),
    accessibility: Object.freeze({ hash: '#accessibilite', pageId: 'pr01bAccessibilityPage' })
  });
  var lastSecondaryTrigger = null;

  function cleanText(value, limit) {
    return String(value == null ? '' : value).replace(/\s+/g, ' ').trim().slice(0, limit || 800);
  }

  function readConversations() {
    try {
      var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (!Array.isArray(parsed)) return [];
      return parsed.map(function(item){
        return {
          id: cleanText(item && item.id, 80),
          need: cleanText(item && item.need, 800),
          clarified: cleanText(item && item.clarified, 240),
          next: cleanText(item && item.next, 240),
          updatedAt: cleanText(item && item.updatedAt, 40)
        };
      }).filter(function(item){ return item.id && item.need; }).slice(0, MAX_CONVERSATIONS);
    } catch (_) { return []; }
  }

  function saveConversation(need) {
    var cleanNeed = cleanText(need, 800);
    if (!cleanNeed) return null;
    var now = new Date().toISOString();
    var item = {
      id: 'decision-' + Date.now().toString(36),
      need: cleanNeed,
      clarified: 'Ton besoin initial est enregistré.',
      next: 'Préciser ce qui compte le plus pour toi.',
      updatedAt: now
    };
    var items = [item].concat(readConversations().filter(function(existing){ return existing.need !== cleanNeed; })).slice(0, MAX_CONVERSATIONS);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (_) {}
    return item;
  }

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function titleFromNeed(need) {
    var text = cleanText(need, 80).replace(/[.?!]+$/,'');
    if (text.length <= 48) return text;
    return text.slice(0,45).trim() + '…';
  }

  function renderConversations() {
    var list = document.getElementById('pr01bConversationList');
    if (!list) return;
    var items = readConversations();
    if (!items.length) {
      list.innerHTML = '<div class="pr01b-empty"><strong>Commence par expliquer ce que tu essaies de décider.</strong><span>Tes conversations apparaîtront ici, sans fiche produit ni indicateur artificiel.</span></div>';
      return;
    }
    list.innerHTML = items.map(function(item){
      return '<article class="pr01b-conversation" data-home-conversation="true">' +
        '<div class="pr01b-conv-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5.5 4v-4.8A2.5 2.5 0 0 1 4 13.7z"/><path d="M8 9h.01M12 9h.01M16 9h.01"/></svg></div>' +
        '<div class="pr01b-conv-body"><div class="pr01b-conv-label">Conversation en cours</div>' +
        '<h3 class="pr01b-conv-title">' + escapeHtml(titleFromNeed(item.need)) + '</h3>' +
        '<p class="pr01b-conv-line"><strong>Ton besoin :</strong> ' + escapeHtml(item.need) + '</p>' +
        '<p class="pr01b-conv-line"><strong>Déjà clarifié :</strong> ' + escapeHtml(item.clarified) + '</p>' +
        '<div class="pr01b-conv-next">Prochaine étape : ' + escapeHtml(item.next) + '</div></div></article>';
    }).join('');
  }

  function showMessage(text) {
    var element = document.getElementById('pr01bHomeMessage');
    if (!element) return;
    element.textContent = cleanText(text, 240);
    element.dataset.visible = 'true';
  }

  function openConversation(prompt) {
    var safePrompt = cleanText(prompt, 800);
    if (!safePrompt) return;
    saveConversation(safePrompt);
    renderConversations();
    showMessage('Ta réflexion est enregistrée. Julvox ouvre la conversation pour poursuivre avec toi.');
    if (typeof window.openAIChat === 'function' && typeof window.sendAIMessage === 'function') {
      window.openAIChat();
      window.setTimeout(function(){ window.sendAIMessage(safePrompt); }, 80);
      return;
    }
    var input = document.getElementById('chatInput');
    if (input) input.value = safePrompt;
  }

  function focusComposer() {
    document.getElementById('pr01bConversationInput')?.focus();
    document.querySelector('.pr01b-hero')?.scrollIntoView({behavior:'smooth',block:'center'});
  }

  function closeMobileMenu() {
    var sheet = document.getElementById('pr01bMobileSheet');
    var button = root.querySelector('[data-home-action="toggle-menu"]');
    if (sheet) { sheet.dataset.open = 'false'; sheet.setAttribute('aria-hidden', 'true'); }
    if (button) button.setAttribute('aria-expanded', 'false');
  }

  function updateHash(hash) {
    if (!hash || window.location.hash === hash) return;
    try { window.history.pushState({ julvoxRoute: hash }, '', hash); }
    catch (_) { window.location.hash = hash; }
  }

  function installSecondaryRouteStyles() {
    if (document.getElementById('pr01b-secondary-route-styles')) return;
    var style = document.createElement('style');
    style.id = 'pr01b-secondary-route-styles';
    style.textContent = [
      '.pr01b-secondary-page[hidden]{display:none!important}',
      '.pr01b-secondary-page{position:fixed;inset:0;z-index:80;overflow:auto;background:#FCF9F4;color:#162536;padding:max(24px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}',
      '.pr01b-secondary-card{width:min(760px,100%);margin:0 auto;background:#fffdf9;border:1px solid rgba(11,29,52,.10);border-radius:24px;box-shadow:0 18px 50px rgba(43,34,23,.10);padding:24px}',
      '.pr01b-secondary-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}',
      '.pr01b-secondary-back{border:1px solid rgba(11,29,52,.10);background:#fff;border-radius:12px;padding:9px 12px;color:#0B1D34;font:650 13px/1 Inter,system-ui,sans-serif;cursor:pointer}',
      '.pr01b-secondary-title{margin:0;font:650 26px/1.15 Sora,Inter,system-ui,sans-serif;color:#0B1D34;letter-spacing:-.5px}',
      '.pr01b-secondary-copy{font:500 15px/1.65 Inter,system-ui,sans-serif;color:#52616b}',
      '.pr01b-secondary-copy strong{color:#0B1D34}',
      '.pr01b-secondary-row{display:flex;justify-content:space-between;gap:18px;padding:15px 0;border-top:1px solid rgba(11,29,52,.08)}',
      '.pr01b-secondary-row:first-of-type{margin-top:20px}',
      '.pr01b-secondary-row span:last-child{color:#65717C;text-align:right}',
      '#pr01bMobileSheet .pr01b-mobile-sheet-card{width:min(320px,calc(100vw - 28px));padding:8px;display:grid;gap:4px;align-content:start;background:#fffdf9;border-radius:20px;box-shadow:var(--pr01b-shadow)}',
      '#pr01bMobileSheet .pr01b-nav-btn{width:100%!important;height:56px;min-height:56px;justify-content:flex-start!important;align-items:center!important;padding:0 16px!important;gap:14px!important;border-radius:14px;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:rgba(14,167,161,.12);transition:background .14s ease,transform .14s ease}',
      '#pr01bMobileSheet .pr01b-nav-icon{position:static;flex:0 0 24px;width:24px;height:24px}',
      '#pr01bMobileSheet .pr01b-nav-icon svg{width:22px;height:22px}',
      '#pr01bMobileSheet .pr01b-nav-label{position:static!important;width:auto!important;height:auto!important;overflow:hidden!important;clip:auto!important;white-space:nowrap!important;flex:1 1 auto;min-width:0;text-overflow:ellipsis;text-align:left;font-size:15px;line-height:1.2}',
      '#pr01bMobileSheet .pr01b-nav-btn:hover,#pr01bMobileSheet .pr01b-nav-btn:focus-visible{background:rgba(14,167,161,.08);transform:none;outline:2px solid rgba(14,167,161,.20);outline-offset:-2px}',
      '#pr01bMobileSheet .pr01b-nav-btn:active{background:rgba(14,167,161,.16);transform:scale(.985)}',
      '@media (max-width:760px){.pr01b-secondary-page{padding:calc(16px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}.pr01b-secondary-card{border-radius:20px;padding:18px}.pr01b-secondary-title{font-size:22px}.pr01b-secondary-row{flex-direction:column;gap:5px}.pr01b-secondary-row span:last-child{text-align:left}}',
      '@media (orientation:landscape) and (max-height:500px) and (max-width:960px){body{padding-bottom:60px!important}#julvoxDecisionHome .pr01b-shell{display:block}#julvoxDecisionHome .pr01b-sidebar,#julvoxDecisionHome .pr01b-topline{display:none}#julvoxDecisionHome .pr01b-mobilebar{display:flex;position:sticky;top:0;z-index:25;height:56px;align-items:center;justify-content:space-between;padding:6px 16px;background:rgba(255,253,249,.96);border-bottom:1px solid var(--pr01b-line);backdrop-filter:blur(16px)}#julvoxDecisionHome .pr01b-mobile-brand{display:flex;align-items:center;gap:9px;color:var(--pr01b-navy);font-family:Sora,Inter,Arial,sans-serif;font-size:20px;font-weight:600}#julvoxDecisionHome .pr01b-mobile-menu{border:1px solid var(--pr01b-line);background:#fff;border-radius:12px;padding:9px 12px;color:var(--pr01b-navy);font:650 14px/1 Inter,system-ui,sans-serif}#julvoxDecisionHome .pr01b-mobile-nav{display:grid;position:fixed;z-index:50;left:0;right:0;bottom:0;height:56px;grid-template-columns:repeat(3,1fr);background:rgba(255,253,249,.96);border-top:1px solid var(--pr01b-line);backdrop-filter:blur(18px)}#julvoxDecisionHome .pr01b-mobile-nav button{border:0;background:transparent;color:#52616b;font:600 10px/1.2 Inter,system-ui,sans-serif;display:grid;place-items:center;align-content:center;gap:3px}#julvoxDecisionHome .pr01b-mobile-nav button:first-child{color:#0b6764}#julvoxDecisionHome .pr01b-mobile-nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}#pr01bMobileSheet{position:fixed;z-index:60;inset:0;background:rgba(11,29,52,.22);padding:60px 14px 12px;align-items:flex-start;justify-content:flex-end;overflow:auto}#pr01bMobileSheet[data-open="true"]{display:flex}}'
    ].join('');
    document.head.appendChild(style);
  }

  function createSecondaryPage(id, title, bodyHtml) {
    if (document.getElementById(id)) return;
    var page = document.createElement('section');
    page.id = id;
    page.className = 'pr01b-secondary-page';
    page.hidden = true;
    page.setAttribute('aria-hidden', 'true');
    page.setAttribute('aria-labelledby', id + 'Title');
    page.innerHTML = '<div class="pr01b-secondary-card">' +
      '<div class="pr01b-secondary-head"><button class="pr01b-secondary-back" type="button" data-home-action="close-secondary">← Retour</button>' +
      '<h1 class="pr01b-secondary-title" id="' + id + 'Title">' + escapeHtml(title) + '</h1></div>' + bodyHtml + '</div>';
    root.appendChild(page);
  }

  function assistantButtonMarkup() {
    return '<span class="pr01b-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5.5 4v-4.8A2.5 2.5 0 0 1 4 13.7z"/><path d="M8 9h.01M12 9h.01M16 9h.01"/></svg></span><span class="pr01b-nav-label">Assistant</span>';
  }

  function accessibilityButtonMarkup() {
    return '<span class="pr01b-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="1.7"/><path d="M5 8h14M12 8v5.5M8.5 21 12 14l3.5 7"/></svg></span><span class="pr01b-nav-label">Accessibilité</span>';
  }

  function appendSecondaryButton(container, action, ariaLabel, markup) {
    if (container.querySelector('[data-home-action="' + action + '"]')) return;
    var button = document.createElement('button');
    button.className = 'pr01b-nav-btn';
    button.type = 'button';
    button.dataset.homeAction = action;
    button.setAttribute('aria-label', ariaLabel);
    button.innerHTML = markup;
    container.appendChild(button);
  }

  function installSecondaryNavigation() {
    installSecondaryRouteStyles();

    root.querySelectorAll('[data-home-action="help"] .pr01b-nav-label').forEach(function(label){ label.textContent = 'Informations'; });
    root.querySelectorAll('[data-home-action="help"]').forEach(function(button){ button.setAttribute('aria-label', 'Aide et informations'); });
    root.querySelectorAll('[data-home-action="settings"]').forEach(function(button){ button.setAttribute('aria-label', 'Paramètres utilisateur'); });

    root.querySelectorAll('.pr01b-nav-secondary, .pr01b-mobile-sheet-card').forEach(function(container){
      appendSecondaryButton(container, 'assistant', 'Assistant IA', assistantButtonMarkup());
      appendSecondaryButton(container, 'accessibility', 'Accessibilité', accessibilityButtonMarkup());
    });

    createSecondaryPage(
      SECONDARY_ROUTES.help.pageId,
      'Aide / Informations',
      '<div class="pr01b-secondary-copy"><p><strong>Julvox est ton compagnon de décision avant achat.</strong> Il t’aide à clarifier un besoin, à distinguer les faits confirmés des incertitudes et à comprendre ce qui peut réellement changer ta décision.</p><p style="margin-top:14px">Pour poursuivre une réflexion, ouvre l’Assistant ou reviens à l’accueil et décris simplement ce qui te fait hésiter.</p></div>'
    );
    createSecondaryPage(
      SECONDARY_ROUTES.settings.pageId,
      'Paramètres utilisateur',
      '<div class="pr01b-secondary-copy"><p>Ces réglages appartiennent à l’espace utilisateur Julvox. Ouvrir cette page ne déclenche pas automatiquement une connexion.</p>' +
      '<div class="pr01b-secondary-row"><strong>Langue</strong><span>Français</span></div>' +
      '<div class="pr01b-secondary-row"><strong>Navigation</strong><span>Accueil, conversations et décisions</span></div>' +
      '<div class="pr01b-secondary-row"><strong>Compte</strong><span>Une connexion est demandée uniquement lorsqu’une action liée au compte l’exige.</span></div></div>'
    );
    createSecondaryPage(
      SECONDARY_ROUTES.accessibility.pageId,
      'Accessibilité',
      '<div class="pr01b-secondary-copy"><p><strong>Les réglages d’accessibilité seront regroupés ici.</strong> Cette première étape crée une destination dédiée sans activer de préférence non implémentée.</p>' +
      '<div class="pr01b-secondary-row"><strong>Texte agrandi</strong><span>À venir</span></div>' +
      '<div class="pr01b-secondary-row"><strong>Contraste renforcé</strong><span>À venir</span></div>' +
      '<div class="pr01b-secondary-row"><strong>Mode daltonien</strong><span>À venir</span></div>' +
      '<div class="pr01b-secondary-row"><strong>Police dyslexie</strong><span>À venir</span></div>' +
      '<div class="pr01b-secondary-row"><strong>Lecture vocale</strong><span>À venir</span></div>' +
      '<div class="pr01b-secondary-row"><strong>Réduction des animations</strong><span>À venir</span></div>' +
      '<div class="pr01b-secondary-row"><strong>Boutons agrandis</strong><span>À venir</span></div>' +
      '<div class="pr01b-secondary-row"><strong>TalkBack</strong><span>Compatibilité à renforcer</span></div></div>'
    );
  }

  function closeSecondaryPage(options) {
    root.querySelectorAll('.pr01b-secondary-page').forEach(function(page){
      page.hidden = true;
      page.setAttribute('aria-hidden', 'true');
    });
    if (!options || options.restoreHash !== false) {
      try { window.history.replaceState({}, '', '#julvoxDecisionHome'); } catch (_) {}
    }
    if (lastSecondaryTrigger && typeof lastSecondaryTrigger.focus === 'function') lastSecondaryTrigger.focus();
    lastSecondaryTrigger = null;
  }

  function openSecondaryPage(pageId, hash, trigger) {
    closeSecondaryPage({ restoreHash: false });
    closeMobileMenu();
    var page = document.getElementById(pageId);
    if (!page) return;
    lastSecondaryTrigger = trigger || document.activeElement;
    page.hidden = false;
    page.setAttribute('aria-hidden', 'false');
    updateHash(hash);
    page.querySelector('[data-home-action="close-secondary"]')?.focus();
  }

  function openAssistant(trigger) {
    closeSecondaryPage({ restoreHash: false });
    closeMobileMenu();
    lastSecondaryTrigger = trigger || document.activeElement;
    updateHash(SECONDARY_ROUTES.assistant.hash);
    if (typeof window.openAIChat === 'function') window.openAIChat();
    else focusComposer();
  }

  function navigate(action, trigger) {
    if (action === 'home') { closeSecondaryPage({ restoreHash: false }); closeMobileMenu(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if (action === 'conversations') { closeSecondaryPage({ restoreHash: false }); closeMobileMenu(); focusComposer(); return; }
    if (action === 'decisions') { closeSecondaryPage({ restoreHash: false }); closeMobileMenu(); document.getElementById('pr01bDecisions')?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
    if (action === 'help') { openSecondaryPage(SECONDARY_ROUTES.help.pageId, SECONDARY_ROUTES.help.hash, trigger); return; }
    if (action === 'settings') { openSecondaryPage(SECONDARY_ROUTES.settings.pageId, SECONDARY_ROUTES.settings.hash, trigger); return; }
    if (action === 'assistant') { openAssistant(trigger); return; }
    if (action === 'accessibility') { openSecondaryPage(SECONDARY_ROUTES.accessibility.pageId, SECONDARY_ROUTES.accessibility.hash, trigger); return; }
    if (action === 'close-secondary') { closeSecondaryPage(); return; }
    if (action === 'toggle-menu') {
      var sheet = document.getElementById('pr01bMobileSheet');
      var button = root.querySelector('[data-home-action="toggle-menu"]');
      var open = sheet && sheet.dataset.open !== 'true';
      if (sheet) { sheet.dataset.open = open ? 'true' : 'false'; sheet.setAttribute('aria-hidden', open ? 'false' : 'true'); }
      if (button) button.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
  }

  root.addEventListener('click', function(event){
    var actionElement = event.target.closest('[data-home-action]');
    if (actionElement) { event.preventDefault(); navigate(actionElement.dataset.homeAction, actionElement); return; }
    var example = event.target.closest('[data-home-example]');
    if (example) {
      var input = document.getElementById('pr01bConversationInput');
      if (input) { input.value = example.dataset.homeExample || ''; input.focus(); }
      return;
    }
    var inspiration = event.target.closest('[data-home-inspiration]');
    if (inspiration) {
      var composer = document.getElementById('pr01bConversationInput');
      if (composer) { composer.value = 'J’aimerais réfléchir à un achat lié à l’univers ' + inspiration.dataset.homeInspiration.toLowerCase() + '.'; composer.focus(); }
      document.querySelector('.pr01b-hero')?.scrollIntoView({behavior:'smooth',block:'center'});
    }
  });

  document.getElementById('pr01bConversationForm')?.addEventListener('submit', function(event){
    event.preventDefault();
    var input = document.getElementById('pr01bConversationInput');
    var prompt = cleanText(input && input.value, 800);
    if (!prompt) { showMessage('Explique-moi simplement ce que tu essaies de décider.'); input?.focus(); return; }
    if (input) input.value = '';
    openConversation(prompt);
  });

  document.getElementById('pr01bConversationInput')?.addEventListener('input', function(){
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight,128) + 'px';
  });

  document.getElementById('pr01bMobileSheet')?.addEventListener('click', function(event){
    if (event.target === this) navigate('toggle-menu');
  });

  try {
    var user = typeof window.currentUser !== 'undefined' ? window.currentUser : null;
    var fullName = cleanText(user && (user.name || user.full_name || user.email), 80);
    if (fullName) {
      var first = fullName.split(/[ @]/)[0];
      root.querySelectorAll('[data-home-first-name]').forEach(function(element){ element.textContent = first; });
      root.querySelectorAll('[data-home-user-name]').forEach(function(element){ element.textContent = fullName; });
    }
  } catch (_) {}

  installSecondaryNavigation();
  renderConversations();
})();
</script>
