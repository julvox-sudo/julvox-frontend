name: Julvox A2.2 materialization

on:
  push:
    branches:
      - product-realign-01b-home-final

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: product-realign-01b-home-final
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize official identity
        shell: bash
        run: |
          set -euo pipefail
          cat .brand-materialize/icon512.* | base64 -d > icons/icon-512.png
          echo 'b61af9f6b613062a32eab2a1ab4b3dbc6eaa0ea5add3f8fd03de1ab3a298395f  icons/icon-512.png' | sha256sum -c -
          sed -i 's/PRODUCT-REALIGN-01B-BRAND-INTEGRATION-07/PRODUCT-REALIGN-01B-BRAND-INTEGRATION-08/g' scripts/product-realign-01b-brand-integrate.js tests/ui-00/product-realign-01b-brand.test.js
          rm -rf .brand-materialize
          rm -f .github/workflows/brand-materialize.yml

      - name: Verify tests, artifact and determinism
        run: npm run verify:all

      - name: Commit locked identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(brand): verrouille l’identité officielle dans l’artefact public'
          git push origin HEAD:product-realign-01b-home-final

# PRODUCT-REALIGN-01B-BRAND-INTEGRATION-08 trigger
