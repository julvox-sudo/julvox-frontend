name: Frontend baseline

on:
  pull_request:
  push:
    branches:
      - main
      - "frontend/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: frontend-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm run build

      - name: Verify exact public artifact
        run: npm run verify:public-artifact

      - name: Verify public references
        run: npm run verify:public-references

      - name: Verify deterministic public build
        run: npm run verify:public-determinism

      - name: Record public artifact proof
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.json
          test -f dist/runtime-config.js
          test -f dist/enhancements_v3.js
          test -f build-reports/public-artifact-inventory.json
          test -f build-reports/public-reference-report.json
          test "$(find dist -type f | wc -l | tr -d ' ')" = "15"
          test ! -e dist/.github
          test ! -e dist/config
          test ! -e dist/docs
          test ! -e dist/scripts
          test ! -e dist/tests
          test ! -e dist/package.json
          test ! -e dist/build-static.js
          find dist -type f -print | LC_ALL=C sort
          cat build-reports/public-artifact-inventory.json

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: julvox-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload public artifact reports
        uses: actions/upload-artifact@v4
        with:
          name: julvox-frontend-public-artifact-reports
          path: build-reports/*.json
          if-no-files-found: error
          retention-days: 14
