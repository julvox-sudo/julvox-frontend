name: Frontend baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run UI-00 tests directly
        run: node --test tests/ui-00/*.test.js

      - name: Build
        run: npm run build

      - name: Run complete verification chain
        run: npm run verify:all

      - name: Verify distribution separately
        run: npm run verify:dist

      - name: Verify public manifest separately
        run: npm run verify:public-manifest

      - name: Verify exact public artifact
        run: npm run verify:public-artifact

      - name: Verify public references
        run: npm run verify:public-references

      - name: Verify deterministic public build
        run: npm run verify:public-determinism

      - name: Verify production truth separately
        run: npm run verify:production-truth

      - name: Record independent public artifact proof
        shell: bash
        run: |
          set -euo pipefail
          expected_files="$RUNNER_TEMP/quality01a-expected-files.txt"
          actual_files="$RUNNER_TEMP/quality01a-actual-files.txt"
          expected_directories="$RUNNER_TEMP/quality01a-expected-directories.txt"
          actual_directories="$RUNNER_TEMP/quality01a-actual-directories.txt"

          cat > "$expected_files" <<'PATHS'
          api-client.js
          brand/julvox-glyph-small.svg
          brand/julvox-logo-horizontal-negative.svg
          brand/julvox-logo-horizontal.svg
          enhancements_v3.js
          google3a92a4041aeeec5e.html
          icons/icon-192.png
          icons/icon-512.png
          icons/julvox-favicon-16-transparent.png
          icons/julvox-favicon-32-transparent.png
          index.html
          manifest.json
          robots.txt
          runtime-config.js
          sitemap.xml
          sw.js
          ui-00-production-truth.js
          PATHS

          cat > "$expected_directories" <<'PATHS'
          brand
          icons
          PATHS

          find dist -type f -printf '%P\n' | LC_ALL=C sort > "$actual_files"
          find dist -mindepth 1 -type d -printf '%P\n' | LC_ALL=C sort > "$actual_directories"
          diff -u "$expected_files" "$actual_files"
          diff -u "$expected_directories" "$actual_directories"

          test -f build-reports/public-artifact-inventory.json
          test -f build-reports/public-reference-report.json
          test ! -e dist/.git
          test ! -e dist/.github
          test ! -e dist/build-reports
          test ! -e dist/config
          test ! -e dist/docs
          test ! -e dist/scripts
          test ! -e dist/tests
          test ! -e dist/package.json
          test ! -e dist/build-static.js
          test -z "$(find dist -type l -print -quit)"

          cat "$actual_files"
          cat build-reports/public-artifact-inventory.json
          cat build-reports/public-reference-report.json

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: julvox-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload public artifact reports
        uses: actions/upload-artifact@v4
        with:
          name: julvox-frontend-public-artifact-reports
          path: build-reports/*.json
          if-no-files-found: error
          retention-days: 14
